# NOTE: SPREADSHEET_ID, API_GATEWAY_SUBMIT_URL, and API_GATEWAY_LIST_URL must
# already be set on the Cloud Run service (e.g. via a prior deploy or Terraform).
# This pipeline only sets GOOGLE_APPLICATION_CREDENTIALS; a first-time deploy
# from scratch will fail at runtime until those vars are added.
steps:
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args: ['-c', 'npm ci && npm run lint && npm run typecheck && npm run test:cov']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dynamo-node-sheets-gpc:$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dynamo-node-sheets-gpc:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'dynamo-node-sheets-gpc'
      - '--image=gcr.io/$PROJECT_ID/dynamo-node-sheets-gpc:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-secrets=/secrets/sa-key.json=dynamo-node-sheets-gpc-sa-key:latest'
      - '--set-env-vars=GOOGLE_APPLICATION_CREDENTIALS=/secrets/sa-key.json'

images:
  - 'gcr.io/$PROJECT_ID/dynamo-node-sheets-gpc:$SHORT_SHA'
